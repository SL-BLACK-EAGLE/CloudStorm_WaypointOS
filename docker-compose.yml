# Waypoint Delivery OS - complete local stack.
#   docker compose up          -> http://localhost:3000
# Services mirror the cloud stack one-for-one (see docs/architecture.md):
#   postgres  ~ Neon Postgres         s3     ~ Neon Object Storage (SeaweedFS)
#   redis+srh ~ Upstash Redis         qstash ~ Upstash QStash
#   convex    ~ Convex Cloud          web    = Next.js app, seed = one-shot seeding job
name: waypoint

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint
      POSTGRES_DB: waypoint
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypoint"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (local stand-in for Neon Object Storage): PoD photos, signatures
  s3:
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.port=9000 -master.volumeSizeLimitMB=64 -volume.max=0 -ip.bind=0.0.0.0
    ports:
      - "9000:9000"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/status || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Upstash Redis stand-in: Redis + the Upstash-compatible REST proxy the SDK talks to
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-rest:
    image: hiett/serverless-redis-http:0.0.10
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-srh-token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "8079:80"
    depends_on:
      redis:
        condition: service_healthy

  # Convex (realtime) - the open-source backend, same functions as Convex Cloud
  convex:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "3210:3210" # client API / websocket
      - "3211:3211" # HTTP actions
    environment:
      INSTANCE_NAME: waypoint
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:?set CONVEX_INSTANCE_SECRET in .env (openssl rand -hex 32)}
      CONVEX_CLOUD_ORIGIN: http://127.0.0.1:3210
      CONVEX_SITE_ORIGIN: http://127.0.0.1:3211
      DISABLE_BEACON: "true"
    volumes:
      - convexdata:/convex/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3210/version || exit 1"]
      interval: 5s
      start_period: 10s
      retries: 20

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    ports:
      - "6791:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: http://127.0.0.1:3210
    depends_on:
      convex:
        condition: service_healthy

  # one-shot: derive the Convex admin key (deterministic from instance name + secret) into a shared volume
  convex-init:
    image: ghcr.io/get-convex/convex-backend:latest
    entrypoint: ["bash", "-c", "./generate_admin_key.sh | tail -1 > /keys/admin_key && echo admin key ready"]
    environment:
      INSTANCE_NAME: waypoint
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:?set CONVEX_INSTANCE_SECRET in .env (openssl rand -hex 32)}
    volumes:
      - convexkeys:/keys
    depends_on:
      convex:
        condition: service_healthy

  # one-shot: push the Convex functions (convex/) and the relay secret to the local backend
  convex-push:
    build: { context: ., target: tools }
    working_dir: /repo/apps/web
    command: >
      sh -c 'export CONVEX_SELF_HOSTED_ADMIN_KEY="$$(cat /keys/admin_key)" &&
      npx convex deploy -y &&
      npx convex env set CONVEX_SERVER_SECRET "$$CONVEX_SERVER_SECRET"'
    environment:
      CONVEX_SELF_HOSTED_URL: http://convex:3210
      CONVEX_SERVER_SECRET: ${CONVEX_SERVER_SECRET}
    volumes:
      - convexkeys:/keys:ro
    depends_on:
      convex-init:
        condition: service_completed_successfully

  # one-shot: migrations + seed (only on a fresh database). The dataset is mounted, never baked in.
  seed:
    build: { context: ., target: tools }
    command: sh -c "pnpm --filter @waypoint/db migrate && pnpm --filter @waypoint/db seed --if-empty"
    env_file: .env
    environment:
      DATABASE_URL: postgres://waypoint:waypoint@postgres:5432/waypoint
      DATABASE_URL_UNPOOLED: postgres://waypoint:waypoint@postgres:5432/waypoint
      SEED_DATA_DIR: /repo/seed-data
    volumes:
      - ./seed-data:/repo/seed-data:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CONVEX_URL: http://localhost:3210
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://waypoint:waypoint@postgres:5432/waypoint
      DATABASE_URL_UNPOOLED: postgres://waypoint:waypoint@postgres:5432/waypoint
      UPSTASH_REDIS_REST_URL: http://redis-rest:80
      UPSTASH_REDIS_REST_TOKEN: local-srh-token
      S3_ENDPOINT: http://s3:9000
      S3_REGION: us-east-1
      S3_BUCKET: waypoint-pod
      S3_ACCESS_KEY_ID: waypoint
      S3_SECRET_ACCESS_KEY: waypoint-secret
      S3_FORCE_PATH_STYLE: "true"
      CONVEX_URL: http://convex:3210
    depends_on:
      seed:
        condition: service_completed_successfully
      convex-push:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
      redis-rest:
        condition: service_started

volumes:
  pgdata:
  s3data:
  convexdata:
  convexkeys:

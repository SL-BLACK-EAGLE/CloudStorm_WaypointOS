# Waypoint Delivery OS - complete local stack.
#   docker compose up          -> http://localhost:3000
# Services mirror the cloud stack one-for-one (see docs/architecture.md):
#   postgres  ~ Neon Postgres         s3     ~ Neon Object Storage (SeaweedFS)
#   redis+srh ~ Upstash Redis         qstash ~ Upstash QStash
#   convex    ~ Convex Cloud          web    = Next.js app, seed = one-shot seeding job
name: waypoint

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint
      POSTGRES_DB: waypoint
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypoint"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (local stand-in for Neon Object Storage): PoD photos, signatures
  s3:
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.port=9000 -master.volumeSizeLimitMB=64 -volume.max=0 -ip.bind=0.0.0.0
    ports:
      - "9000:9000"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/status || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Upstash Redis stand-in: Redis + the Upstash-compatible REST proxy the SDK talks to
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-rest:
    image: hiett/serverless-redis-http:0.0.10
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-srh-token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "8079:80"
    depends_on:
      redis:
        condition: service_healthy

  # Convex (realtime) - the open-source backend, same functions as Convex Cloud
  convex:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "3210:3210" # client API / websocket
      - "3211:3211" # HTTP actions
    environment:
      INSTANCE_NAME: waypoint
      CONVEX_CLOUD_ORIGIN: http://127.0.0.1:3210
      CONVEX_SITE_ORIGIN: http://127.0.0.1:3211
      DISABLE_BEACON: "true"
    volumes:
      - convexdata:/convex/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3210/version || exit 1"]
      interval: 5s
      start_period: 10s
      retries: 20

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    ports:
      - "6791:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: http://127.0.0.1:3210
    depends_on:
      convex:
        condition: service_healthy

volumes:
  pgdata:
  s3data:
  convexdata:

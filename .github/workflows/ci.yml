# Continuous integration. The competition dataset is confidential and never reaches CI, so planner
# parity runs on a synthetic operation: the Python oracle regenerates the golden plans and the job
# fails if they differ from the committed fixtures the TypeScript tests read.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (all packages)
        run: pnpm typecheck
      - name: Lint (web)
        run: pnpm --filter web lint
      - name: Unit tests (planner flowchart, parity and optimizer on the synthetic operation)
        run: pnpm test

  oracle-parity:
    name: Planner parity with the Python oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/planner-oracle/requirements.txt
      - run: pip install -r tools/planner-oracle/requirements.txt
      - name: Regenerate synthetic golden plans with the oracle
        run: python tools/planner-oracle/export_synthetic.py
      - name: Committed fixtures must equal the oracle's output
        run: git diff --exit-code -- packages/planner/test/synthetic
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript planner reproduces the oracle and the optimizer keeps every rule
        run: pnpm --filter @waypoint/planner test

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Tools image (migrations, seed, Convex push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
